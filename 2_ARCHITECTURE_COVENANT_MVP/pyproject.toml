[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "halyk-covenants"
version = "0.1.0"
description = "Deterministic covenant evaluation MVP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.1",
  "python-dotenv>=1.0",
  "langchain>=1.0,<2",
  "langchain-deepseek>=1.0,<2",
  "langgraph>=1.0,<2",
  "langsmith>=0.4,<1",
  "openpyxl>=3.1",
  "numpy>=1.26",
  "pandas>=2.2,<3",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pyarrow>=17",
  "pyyaml==6.0.2",
  "pymupdf>=1.24",
  "reportlab>=4.2",
  "rapidfuzz>=3.9",
  "rank-bm25>=0.2.2",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
]
semantic = [
  "faiss-cpu>=1.8",
  "sentence-transformers>=3,<6",
]
ocr = [
  "paddleocr==3.4.1",
]

[project.scripts]
halyk-covenants = "halyk_covenants.cli:app"
halyk-review = "halyk_covenants.review_cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/halyk_covenants"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  # Tests that exercise the synthetic dataset generator or the benchmark built
  # on top of it. They disappear with those packages; everything unmarked must
  # survive the migration. Run the survivors with: pytest -m "not mock_dataset"
  "mock_dataset: depends on halyk_covenants.synthetic or .benchmark",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Russian CLI text intentionally contains Cyrillic confusables.

[tool.ruff.lint.per-file-ignores]
# This module intentionally keeps full synthetic contract clauses/rows as readable literals.
"src/halyk_covenants/synthetic/regression_v2.py" = ["E501", "RUF059"]

[tool.ruff.format]
quote-style = "double"
