[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "halyk-covenants"
version = "0.2.0"
description = "Covenant evaluation MVP — Halyk AI Challenge"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "python-dotenv>=1.0",
  "langchain>=1.0,<2",
  "langchain-deepseek>=1.0,<2",
  "langsmith>=0.4,<1",
  "pydantic>=2.8",
  "pymupdf>=1.24",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/halyk"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.format]
quote-style = "double"
