name: codex-1-ci

on:
  push:
    branches: [codex-1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 2_ARCHITECTURE_COVENANT_MVP
    env:
      LANGSMITH_TRACING: "false"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 2_ARCHITECTURE_COVENANT_MVP/pyproject.toml
      - name: Install core and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Ruff
        run: ruff check src tests
      - name: Pytest without live DeepSeek or Paddle runtime
        run: pytest -q
